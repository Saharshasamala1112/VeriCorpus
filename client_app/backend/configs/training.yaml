# VeriCorpus AI - Training Configuration
# ========================================

# --- Corpus Sync Settings ---
corpus_sync:
  batch_size: 100
  languages:
    - en
    - te
    - hi
    - ta
    - kn
    - ml
    - bn
    - mr
    - gu
    - pa
    - ur
    - or
    - as
    - ne
  min_text_length: 50
  max_text_length: 10000
  quality_filters:
    min_word_count: 10
    max_repeated_words_ratio: 0.3
    min_unique_word_ratio: 0.4
    max_punctuation_ratio: 0.3
    min_alpha_ratio: 0.5

# --- Synthetic AI Sample Generation ---
synthetic_generation:
  count: 100
  templates_per_topic: 5
  suffixes_count: 5
  topics:
    - technology
    - science
    - business
    - education
    - academic
    - healthcare
    - environment
    - social

# --- Training Pipeline ---
training:
  # Minimum samples required to train
  min_samples: 20
  min_samples_per_class: 10
  
  # Data splitting
  test_size: 0.2
  validation_size: 0.1
  random_state: 42
  
  # Cross-validation
  cross_validation:
    enabled: true
    cv_folds: 5
  
  # Feature extraction
  features:
    tfidf:
      analyzer: char
      ngram_range: [2, 4]
      min_df: 3
      max_features: 30000
      sublinear_tf: true
    linguistic:
      enabled: true
      features:
        - word_count
        - char_count
        - sentence_count
        - avg_word_length
        - avg_sentence_length
        - vocabulary_richness
        - punctuation_ratio
        - digit_ratio
        - uppercase_ratio
        - long_word_ratio
        - short_word_ratio
        - sentence_length_variance
        - readability_score
        - lexical_density

  # Models to train
  models:
    logistic_regression:
      enabled: true
      params:
        max_iter: 2000
        class_weight: balanced
        C: 0.5
        solver: lbfgs
    
    random_forest:
      enabled: true
      params:
        n_estimators: 200
        max_depth: 20
        class_weight: balanced
        random_state: 42
        n_jobs: -1
    
    gradient_boosting:
      enabled: true
      params:
        n_estimators: 150
        max_depth: 5
        learning_rate: 0.1
        subsample: 0.8
        random_state: 42

  # Ensemble settings
  ensemble:
    enabled: true
    method: voting  # voting or stacking
    weights:
      logistic_regression: 0.3
      random_forest: 0.4
      gradient_boosting: 0.3
  
  # Model selection
  selection:
    metric: f1  # accuracy, f1, roc_auc
    min_improvement: 0.01

# --- Training Schedule ---
schedule:
  auto_retrain: true
  retrain_interval_hours: 6
  min_new_samples_for_retrain: 10
  max_retrains_per_day: 4

# --- Model Persistence ---
persistence:
  model_dir: data/
  model_name: corpusguard_learning
  keep_last_n_versions: 5
  save_vectorizer: true
  save_feature_extractor: true

# --- Monitoring ---
monitoring:
  log_training_runs: true
  log_metrics: true
  alert_on_degradation: true
  degradation_threshold: 0.05
  metrics_history_size: 100

# --- Git Integration ---
git:
  auto_commit: true
  commit_prefix: "chore(training)"
  auto_push: true
  push_branch: Main
  tag_releases: true
  tag_prefix: "model-v"
