services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://postgres:change-me@host.docker.internal:5432/vericorpus}
      - CORPUS_DB_URL=${CORPUS_DB_URL:-postgresql+asyncpg://postgres:change-me@host.docker.internal:5433/indic_corpus}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./uploads:/app/uploads
      - ./reports:/app/reports
    restart: unless-stopped
