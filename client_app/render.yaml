services:
  - type: web
    name: vericorpus-api
    runtime: python
    rootDir: client_app
    buildCommand: pip install -r backend/requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DEBUG
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORPUS_DB_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: FORENSIC_ENABLED
        value: "false"

  - type: web
    name: vericorpus-frontend
    runtime: static
    rootDir: client_app/frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html